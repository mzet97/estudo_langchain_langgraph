[project]
name = "balcao-local"
version = "0.1.0"
description = "ConCierge local de suporte (LangChain + LangGraph, sem nuvem)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pydantic>=2",
  "httpx>=0.27",
  "anyio>=4.15.1",
  "fastapi>=0.162.0",
  "uvicorn>=0.30",
  "langgraph-checkpoint-sqlite>=2",
  "langgraph-checkpoint-postgres>=2",
  "psycopg[binary]>=3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
