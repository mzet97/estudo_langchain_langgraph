services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcao -d balcao"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432" # demo local; evita clash com 5432 do host

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://balcao:balcao@db:5432/balcao
      LLAMA_BASE_URL: http://host.docker.internal:8080/v1
      LLAMA_MODEL: gemma-4-12b-it
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
