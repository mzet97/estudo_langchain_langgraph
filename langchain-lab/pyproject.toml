[project]
name = "langchain-lab"
version = "0.1.0"
description = "Trilha de estudo LangChain (core + openai) contra llama-server local"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pydantic>=2",
  "httpx>=0.27",
  "anyio>=4.15.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
