[project]
name = "lab-graph"
version = "0.1.0"
description = "Laboratorio SDD de 28 projetos LangGraph + Gemma local via llama.cpp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "pydantic>=2",
  "httpx>=0.27",
  "anyio>=4.15.1",
  "fastapi>=0.162.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
